{% extends "admin/base_site.html" %}

{% block content %}
<div class="flex flex-col gap-6">
    <div class="rounded-default border border-base-200 bg-white p-6 dark:border-base-800 dark:bg-base-900">
        <h2 class="text-lg font-semibold">
            Подтверждение действия
        </h2>

        <p class="mt-4 text-sm">
            Вы действительно хотите выполнить операцию для объекта:
            <strong>{{ entry.object_repr }}</strong>?
        </p>

        <p class="mt-2 text-sm text-base-500">
            Тип действия: {{ entry.get_action_display }}.
            Запись истории №{{ entry.pk }}.
        </p>
    </div>

    <form method="post" class="flex flex-wrap items-center gap-3">
        {% csrf_token %}

        <button
            type="submit"
            class="rounded-default bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700"
        >
            Подтвердить
        </button>

        <a
            href="{% url 'admin:audit_auditentry_changelist' %}"
            class="rounded-default border border-base-200 px-4 py-2 text-sm"
        >
            Отмена
        </a>
    </form>
</div>
{% endblock %}
